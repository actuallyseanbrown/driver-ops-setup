# Sean driver-ops — ~/.config/yazi/yazi.toml
[manager]
ratio = [1, 3, 3]
sort_by = "mtime"
sort_reverse = true
show_hidden = false
show_symlink = true

[preview]
tab_size = 2
max_width = 1000
max_height = 1000

[opener]
edit = [
  { run = 'nvim "$@"', block = true, desc = "nvim" },
]
vd = [
  { run = 'vd "$@"', block = true, desc = "VisiData" },
]
open_folder = [
  { run = 'yazi "$@"', desc = "yazi" },
]

[open]
rules = [
  { mime = "text/csv", use = "vd" },
  { name = "*.csv", use = "vd" },
  { name = "*.tsv", use = "vd" },
  { name = "*.xlsx", use = "vd" },
  { name = "*.xls", use = "vd" },
  { name = "*.parquet", use = "vd" },
  { name = "*.md", use = "edit" },
  { name = "*.py", use = "edit" },
  { name = "*.yaml", use = "edit" },
  { name = "*.yml", use = "edit" },
  { name = "*.toml", use = "edit" },
  { name = "*.json", use = "vd" },
  { name = "*/", use = "open_folder" },
]
